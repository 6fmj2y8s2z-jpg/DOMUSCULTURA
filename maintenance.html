<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Domus Cultura — Under construction</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #10110f;
        color: #f3f0e8;
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(100%, 720px); text-align: center; }
      .mark {
        display: inline-block;
        margin-bottom: 5rem;
        font-size: clamp(1.45rem, 3.3vw, 2.3rem);
        line-height: .78;
        letter-spacing: -.09em;
        font-weight: 800;
        text-align: left;
      }
      .rule { width: 52px; height: 1px; margin: 0 auto 2rem; background: #98bb81; }
      p { margin: 0; }
      .eyebrow { font: 500 .68rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: #98bb81; }
      h1 { margin: 1.05rem 0 .9rem; font-size: clamp(2rem, 6vw, 4.6rem); font-weight: 500; letter-spacing: -.055em; line-height: .98; }
      .note { max-width: 430px; margin: auto; font-size: 1rem; line-height: 1.55; color: #c8c6bf; }
      footer { margin-top: 5rem; font: .68rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: #777a70; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-label="Domus Cultura">DOMUS<br />CULTURA</div>
      <div class="rule"></div>
      <p class="eyebrow">Switzerland · Art, image, sound &amp; objects</p>
      <h1>Site under construction.</h1>
      <p class="note">A new Domus Cultura is taking shape. Please return soon.</p>
      <footer>© Domus Cultura</footer>
    </main>
  </body>
</html>
